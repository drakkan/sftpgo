{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="title.download_shared_file">Download shared file</h1>
<div class="stack">
    <p class="auth-lead" data-i18n="fs.download_ready">Your download is ready</p>
    <a class="button button-primary button-wide" href="{{.DownloadLink}}">
        <svg class="icon" aria-hidden="true"><use data-sprite="download"></use></svg>
        <span data-i18n="fs.download">Download</span>
    </a>
</div>
{{- end}}

{{- define "deskfoot"}}
{{- if .LogoutURL}}
<a href="{{.LogoutURL}}" data-i18n="login.signout">Sign out</a>
{{- end}}
{{- end}}
