{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="title.share_login">Share login</h1>
{{- template "notice" .Error}}
<form class="stack" id="sign_in_form" action="{{.CurrentURL}}" method="POST" data-busy>
    <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
    <label class="field">
        <span class="field-label" data-i18n="login.password">Password</span>
        <input class="input" name="share_password" type="password" autocomplete="off" required autofocus>
    </label>
    <button class="button button-primary button-wide" id="sign_in_submit" type="submit" data-i18n="login.signin">Sign in</button>
</form>
{{- end}}

{{- define "deskfoot"}}
{{- if and .Branding.DisclaimerName .Branding.DisclaimerPath}}
<a href="{{.Branding.DisclaimerPath}}" target="_blank" rel="noopener noreferrer">{{.Branding.DisclaimerName}}</a>
{{- end}}
{{- end}}
