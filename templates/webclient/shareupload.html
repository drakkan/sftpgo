{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="title.upload_to_share">Upload to share</h1>
<div class="stack" id="share-upload" data-base="{{.UploadBasePath}}">
    <p class="auth-lead" data-i18n="share.upload_desc"></p>
    <button class="dropzone" id="dropzone" type="button">
        <svg class="icon" aria-hidden="true"><use data-sprite="upload"></use></svg>
        <span data-i18n="fs.upload.message"></span>
    </button>
    <input id="picker" type="file" multiple hidden>
</div>
{{- end}}

{{- define "deskfoot"}}
{{- if .LogoutURL}}
<a href="{{.LogoutURL}}" data-i18n="login.signout">Sign out</a>
{{- end}}
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/transfers.js?v={{.Version}}"></script>
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/share-upload.js?v={{.Version}}"></script>
{{- end}}
