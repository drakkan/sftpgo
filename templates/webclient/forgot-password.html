{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="login.forgot_password">Forgot password?</h1>
{{- template "notice" .Error}}
<form class="stack" id="sign_in_form" action="{{.CurrentURL}}" method="POST" data-busy>
    <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
    <p class="auth-lead" data-i18n="login.forgot_password_msg"></p>
    <label class="field">
        <span class="field-label" data-i18n="login.username">Username</span>
        <input class="input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <button class="button button-primary button-wide" id="sign_in_submit" type="submit" data-i18n="login.send_reset_code">Send reset code</button>
    <a href="{{.LoginURL}}" data-i18n="login.signin">Sign in</a>
</form>
{{- end}}
