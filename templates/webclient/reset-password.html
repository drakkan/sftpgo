{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="login.reset_password">Reset password</h1>
{{- template "notice" .Error}}
<form class="stack" id="sign_in_form" action="{{.CurrentURL}}" method="POST" data-busy>
    <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
    <p class="auth-lead" data-i18n="login.reset_pwd_msg"></p>
    <label class="field">
        <span class="field-label" data-i18n="login.confirm_code">Confirmation code</span>
        <input class="input" name="code" type="text" autocomplete="off" spellcheck="false" required autofocus>
    </label>
    <label class="field">
        <span class="field-label" data-i18n="change_pwd.new">New password</span>
        <input class="input" name="password" type="password" autocomplete="new-password" required>
    </label>
    <label class="field">
        <span class="field-label" data-i18n="change_pwd.confirm">Confirm password</span>
        <input class="input" name="confirm_password" type="password" autocomplete="new-password" required>
    </label>
    <button class="button button-primary button-wide" id="sign_in_submit" type="submit" data-i18n="login.reset_submit">Update password and sign in</button>
    <a href="{{.LoginURL}}" data-i18n="login.signin">Sign in</a>
</form>
{{- end}}
