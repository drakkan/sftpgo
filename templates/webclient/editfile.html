{{template "app" .}}

{{- define "main"}}
<section class="folder" id="editor-page"
    data-path="{{.Path}}"
    data-name="{{.Name}}"
    data-file="{{.FileURL}}"
    data-files="{{.FilesURL}}"
    data-dir="{{.CurrentDir}}"
    data-ping="{{.PingURL}}"
    data-readonly="{{.ReadOnly}}"
    data-nonce="{{.CSPNonce}}">
    <div class="tabs">
        <a class="tab" id="back-tab" href="{{.FilesURL}}">
            <svg class="icon" aria-hidden="true"><use data-sprite="arrow-left"></use></svg>
            <span class="tab-label" data-i18n="title.files"></span>
        </a>
        <div class="tab tab-current"><h1 class="tab-title" title="{{.Path}}">{{.Name}}</h1></div>
    </div>
    <div class="sheet">
        <div class="tools">
            <p class="field-help" data-i18n="{{if .ReadOnly}}title.view_file{{else}}title.edit_file{{end}}"></p>
            {{- if not .ReadOnly}}
            <div class="tools-end">
                <button class="button button-primary button-grow" id="save" type="button">
                    <svg class="icon" aria-hidden="true"><use data-sprite="save"></use></svg>
                    <span data-i18n="general.submit"></span>
                </button>
            </div>
            {{- end}}
        </div>
        <textarea id="source" hidden>{{.Data}}</textarea>
        <div class="editor-wrap" id="editor"></div>
    </div>
</section>
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/vendor/codemirror/cm6.bundle.min.js"></script>
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/editor.js?v={{.Version}}"></script>
{{- end}}
