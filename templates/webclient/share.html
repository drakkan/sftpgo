{{template "app" .}}

{{- define "main"}}
<section class="folder">
    <div class="tabs">
        <a class="tab" href="{{.SharesURL}}"><span class="tab-label" data-i18n="title.shares"></span></a>
        <div class="tab tab-current">
            <h1 class="tab-title" data-i18n="{{if .IsAdd}}title.add_share{{else}}title.update_share{{end}}"></h1>
        </div>
    </div>
    <div class="sheet">
        <div class="prose-width">
            {{- template "notice" .Error}}
            <form class="stack" id="share" action="{{.CurrentURL}}" method="POST" data-busy>
                <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
                <label class="field">
                    <span class="field-label" data-i18n="general.name">Name</span>
                    <input class="input" name="name" type="text" value="{{.Share.Name}}" maxlength="255" required>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="share.scope">Scope</span>
                    <select class="select" name="scope">
                        <option value="1"{{if eq .Share.Scope 1}} selected{{end}} data-i18n="share.scope_read">Read</option>
                        <option value="2"{{if eq .Share.Scope 2}} selected{{end}} data-i18n="share.scope_write">Write</option>
                        <option value="3"{{if eq .Share.Scope 3}} selected{{end}} data-i18n="share.scope_read_write">Read/Write</option>
                    </select>
                    <span class="field-help" data-i18n="share.scope_help"></span>
                </label>
                <div class="field">
                    <span class="field-label" data-i18n="general.paths">Paths</span>
                    <div class="repeat" data-repeat="paths" data-type="input" data-placeholder="share.path_help" data-minimum="1">
                        {{- range .Share.Paths}}
                        <input class="input" name="paths" type="text" value="{{.}}">
                        {{- end}}
                    </div>
                </div>
                <label class="field">
                    <span class="field-label" data-i18n="login.password">Password</span>
                    <input class="input" name="password" type="password" value="{{.Share.Password}}" autocomplete="new-password">
                    <span class="field-help" data-i18n="share.password_help"></span>
                </label>
                <div class="field" id="expiration" data-value="{{.Share.ExpiresAt}}">
                    <label class="field-label" for="expiration-picker" data-i18n="general.expiration">Expiration</label>
                    <input class="input" id="expiration-picker" type="datetime-local">
                    <input type="hidden" name="expiration_date">
                </div>
                <label class="field">
                    <span class="field-label" data-i18n="share.max_tokens">Max tokens</span>
                    <input class="input" name="max_tokens" type="number" min="0" value="{{.Share.MaxTokens}}">
                    <span class="field-help" data-i18n="share.max_tokens_help"></span>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="general.allowed_ip_mask">Allowed IP/Mask</span>
                    <input class="input" name="allowed_ip" type="text" value="{{.Share.GetAllowedFromAsString}}" spellcheck="false">
                    <span class="field-help" data-i18n="general.ip_mask_help"></span>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="general.description">Description</span>
                    <textarea class="textarea" name="description">{{.Share.Description}}</textarea>
                </label>
                <div class="form-actions">
                    <button class="button button-primary" type="submit" data-i18n="client.save_changes">Save changes</button>
                    <a class="button" href="{{.SharesURL}}" data-i18n="client.cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/forms.js?v={{.Version}}"></script>
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/share-form.js?v={{.Version}}"></script>
{{- end}}
