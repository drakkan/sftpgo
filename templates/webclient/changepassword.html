{{template "app" .}}

{{- define "main"}}
<section class="folder">
    <div class="tabs">
        <div class="tab tab-current"><h1 class="tab-title" data-i18n="title.change_password"></h1></div>
    </div>
    <div class="sheet">
        <div class="prose-width">
            {{- template "notice" .Error}}
            {{- if .RequiredAction}}
            <div class="notice notice-warn" role="alert">
                <svg class="icon" aria-hidden="true"><use data-sprite="info"></use></svg>
                <p data-i18n="{{.RequiredAction.Message}}"></p>
            </div>
            {{- end}}
            <form class="stack" action="{{.CurrentURL}}" method="POST" data-busy>
                <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
                <p class="field-help" data-i18n="change_pwd.info"></p>
                <label class="field">
                    <span class="field-label" data-i18n="change_pwd.current">Current password</span>
                    <input class="input" name="current_password" type="password" autocomplete="current-password" required>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="change_pwd.new">New password</span>
                    <input class="input" name="new_password1" type="password" autocomplete="new-password" required>
                </label>
                <label class="field">
                    <span class="field-label" data-i18n="change_pwd.confirm">Confirm password</span>
                    <input class="input" name="new_password2" type="password" autocomplete="new-password" required>
                </label>
                <div class="form-actions">
                    <button class="button button-primary" type="submit" data-i18n="change_pwd.save">Change my password</button>
                </div>
            </form>
        </div>
    </div>
</section>
{{- end}}
