{{template "app" .}}

{{- define "main"}}
<section class="folder" id="shares"
    data-list="{{.SharesURL}}/json"
    data-share="{{.ShareURL}}"
    data-public="{{.BasePublicSharesURL}}"
    data-base="{{.BaseURL}}">
    <div class="tabs">
        <div class="tab tab-current"><h1 class="tab-title" data-i18n="title.shares"></h1></div>
    </div>
    <div class="sheet">
        <div class="tools">
            <label class="search">
                <span class="sr" data-i18n="general.search">Search</span>
                <svg class="icon" aria-hidden="true"><use data-sprite="search"></use></svg>
                <input class="input" id="search" type="search" autocomplete="off" data-i18n="[placeholder]general.search">
            </label>
            <div class="tools-end">
                <a class="button button-primary button-grow" href="{{.ShareURL}}">
                    <svg class="icon" aria-hidden="true"><use data-sprite="plus"></use></svg>
                    <span data-i18n="title.add_share"></span>
                </a>
            </div>
        </div>
        <div id="list"></div>
    </div>
</section>
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webclient/js/shares.js?v={{.Version}}"></script>
{{- end}}
