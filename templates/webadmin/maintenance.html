{{template "app" .}}

{{- define "main"}}
<section class="folder">
    {{- template "pagehead" .}}
    <div class="sheet">
        {{- template "notice" .Error}}
        <div class="form-page">
            <div class="section stack">
                <h2 class="section-title" data-i18n="maintenance.backup"></h2>
                <div><a class="button button-primary" href="{{.BackupPath}}?output-data=1" download data-i18n="maintenance.backup_do"></a></div>
            </div>
            <form class="section stack" action="{{.RestorePath}}" method="POST" enctype="multipart/form-data" data-busy>
                <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
                <h2 class="section-title" data-i18n="maintenance.restore"></h2>
                <label class="field">
                    <span class="field-label" data-i18n="maintenance.backup_file"></span>
                    <input class="input" name="backup_file" type="file" accept="application/json,.json" required>
                    <span class="field-help" data-i18n="maintenance.backup_file_help"></span>
                </label>
                <div class="form-grid">
                    <label class="field">
                        <span class="field-label" data-i18n="general.mode"></span>
                        <select class="select" name="mode">
                            <option value="0" data-i18n="maintenance.restore_mode0"></option>
                            <option value="1" data-i18n="maintenance.restore_mode1"></option>
                            <option value="2" data-i18n="maintenance.restore_mode2"></option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="maintenance.after_restore"></span>
                        <select class="select" name="quota">
                            <option value="0" data-i18n="maintenance.quota_mode0"></option>
                            <option value="1" data-i18n="maintenance.quota_mode1"></option>
                            <option value="2" data-i18n="maintenance.quota_mode2"></option>
                        </select>
                    </label>
                </div>
                <div><button class="button button-primary" type="submit" data-i18n="maintenance.restore"></button></div>
            </form>
        </div>
    </div>
</section>
{{- end}}
