{{template "public" .}}

{{- define "main"}}
<h1 class="auth-title" data-i18n="title.setup"></h1>
{{- template "notice" .Error}}
<form class="stack" id="sign_in_form" action="{{.CurrentURL}}" method="POST" data-busy>
    <input type="hidden" name="_form_token" value="{{.CSRFToken}}">
    <p class="auth-lead" data-i18n="setup.desc"></p>
    {{- if .HasInstallationCode}}
    <label class="field">
        {{- /* A hint set in the configuration is the operator's own text and stays as written. */}}
        <span class="field-label"{{if or (not .InstallationCodeHint) (eq .InstallationCodeHint "Installation code")}} data-i18n="setup.install_code">Installation code{{else}}>{{.InstallationCodeHint}}{{end}}</span>
        <input class="input" name="install_code" type="text" autocomplete="off" spellcheck="false" required>
    </label>
    {{- end}}
    <label class="field">
        <span class="field-label" data-i18n="login.username">Username</span>
        <input class="input" name="username" type="text" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label class="field">
        <span class="field-label" data-i18n="login.password">Password</span>
        <input class="input" name="password" type="password" autocomplete="new-password" required>
    </label>
    <label class="field">
        <span class="field-label" data-i18n="change_pwd.confirm">Confirm password</span>
        <input class="input" name="confirm_password" type="password" autocomplete="new-password" required>
    </label>
    <button class="button button-primary button-wide" id="sign_in_submit" type="submit" data-i18n="setup.submit">Create admin and Sign in</button>
</form>
{{- end}}
