{{template "app" .}}

{{- define "main"}}
<section class="folder">
    {{- template "pagehead" .}}
    <div class="sheet">
        <div class="form-grid">
            <label class="field">
                <span class="field-label" data-i18n="general.type">Type</span>
                <select class="select" id="list-type">
                    <option value="1" data-enabled="{{.IsAllowListEnabled}}" data-off="ip_list.allow_list_disabled" data-i18n="ip_list.allow_list"></option>
                    <option value="2" data-enabled="{{.HasDefender}}" data-off="ip_list.defender_disabled" data-i18n="ip_list.defender_list"></option>
                    <option value="3" data-enabled="{{.RateLimitersStatus}}" data-off="ip_list.ratelimiters_disabled" data-i18n="ip_list.ratelimiters_safe_list"></option>
                </select>
            </label>
            <div class="field">
                <label class="field-label" for="list-filter" data-i18n="ip_list.search"></label>
                <div class="row-tools">
                    <input class="input" id="list-filter" type="search" autocomplete="off" spellcheck="false">
                    <button class="button" id="list-search" type="button" data-i18n="general.search"></button>
                </div>
            </div>
        </div>
        <div class="notice notice-warn" id="list-disabled" role="status" hidden>
            <svg class="icon" aria-hidden="true"><use data-sprite="info"></use></svg>
            <p></p>
        </div>
        <div class="section" data-list="iplists"></div>
    </div>
</section>
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webadmin/js/lists.js?v={{.Version}}"></script>
{{- end}}
