{{template "app" .}}

{{- define "main"}}
<section class="folder" id="events" data-fs="{{.FsEventsSearchURL}}" data-provider="{{.ProviderEventsSearchURL}}" data-log="{{.LogEventsSearchURL}}">
    {{- template "pagehead" .}}
    <div class="sheet">
        <div class="strip" role="tablist" data-tabs>
            <button type="button" role="tab" data-tab="pane-fs" data-i18n="events.fs_events"></button>
            <button type="button" role="tab" data-tab="pane-provider" data-i18n="events.provider_events"></button>
            <button type="button" role="tab" data-tab="pane-log" data-i18n="events.other_events"></button>
        </div>
        <form class="stack" id="event-filters">
            <div class="form-grid">
                <label class="field"><span class="field-label" data-i18n="events.date_range"></span><input class="input" type="datetime-local" id="filter-start"></label>
                <label class="field"><span class="field-label" data-i18n="events.date_range"></span><input class="input" type="datetime-local" id="filter-end"></label>
                <label class="field"><span class="field-label" data-i18n="login.username"></span><input class="input" type="text" id="filter-username" spellcheck="false" autocomplete="off"></label>
                <label class="field"><span class="field-label">IP</span><input class="input" type="text" id="filter-ip" spellcheck="false" autocomplete="off"></label>
            </div>
            <div id="pane-fs" class="stack">
                <div class="form-grid">
                    <label class="field"><span class="field-label" data-i18n="events.action"></span><input class="input" type="text" id="fs-actions" placeholder="upload,download" spellcheck="false"></label>
                    <label class="field"><span class="field-label" data-i18n="general.protocol"></span><input class="input" type="text" id="fs-protocols" placeholder="SFTP,HTTP" spellcheck="false"></label>
                    <label class="field">
                        <span class="field-label" data-i18n="general.status"></span>
                        <select class="select" id="fs-status">
                            <option value="" data-i18n="ip_list.any"></option>
                            <option value="1" data-i18n="general.ok"></option>
                            <option value="2" data-i18n="general.failed"></option>
                            <option value="3" data-i18n="events.quota_exceeded"></option>
                        </select>
                    </label>
                </div>
            </div>
            <div id="pane-provider" class="stack" hidden>
                <div class="form-grid">
                    <label class="field"><span class="field-label" data-i18n="events.action"></span><input class="input" type="text" id="provider-actions" placeholder="add,update,delete" spellcheck="false"></label>
                    <label class="field"><span class="field-label" data-i18n="events.object"></span><input class="input" type="text" id="provider-types" placeholder="user,admin" spellcheck="false"></label>
                    <label class="field"><span class="field-label" data-i18n="general.name"></span><input class="input" type="text" id="provider-name" spellcheck="false"></label>
                </div>
            </div>
            <div id="pane-log" class="stack" hidden>
                <div class="form-grid">
                    <label class="field">
                        <span class="field-label" data-i18n="events.event"></span>
                        <select class="select" id="log-event">
                            <option value="" data-i18n="ip_list.any"></option>
                            <option value="1" data-i18n="events.login_failed"></option>
                            <option value="2" data-i18n="events.login_missing_user"></option>
                            <option value="3" data-i18n="events.no_login_tried"></option>
                            <option value="4" data-i18n="events.algo_negotiation_failed"></option>
                            <option value="5" data-i18n="events.login_ok"></option>
                        </select>
                    </label>
                    <label class="field"><span class="field-label" data-i18n="general.protocol"></span><input class="input" type="text" id="log-protocols" placeholder="SSH,FTP" spellcheck="false"></label>
                </div>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit" data-i18n="events.search"></button>
            </div>
        </form>
        <div class="section" id="event-table"></div>
    </div>
</section>
{{- end}}

{{- define "pagescripts"}}
<script{{if .CSPNonce}} nonce="{{.CSPNonce}}"{{end}} src="{{.StaticURL}}/webadmin/js/events.js?v={{.Version}}"></script>
{{- end}}
